[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raid-shared-lib"
version = "0.1.0"
description = "EY RAID - cross-cutting Python helpers (auth, audit, storage) shared by admin / analyzer / codegen / enduser backends."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "azure-cosmos>=4.7.0,<5.0.0",
    "azure-core>=1.29.0,<2.0.0",
    # Entra ID access-token validation (AUTH_MODE=entra). Pulls in "cryptography"
    # for RS256 signature verification against the tenant JWKS keys.
    "PyJWT[crypto]>=2.8.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["shared_lib"]
